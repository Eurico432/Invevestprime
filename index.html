function mostrarMsg(txt,tipo){ var el=document.getElementById('mensagemAuth'); if(!el)return; el.textContent=txt; el.className='msg '+tipo; el.style.display='block'; setTimeout(function(){el.style.display='none';},5000); }

function gerarCodigo(){ var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s='IPA'; for(var i=0;i<6;i++) s+=c.charAt(Math.floor(Math.random()*c.length)); return s; }
function gerarLink(cod){ var c='abcdefghijkmnpqrstuvwxyz23456789'; var s=''; for(var i=0;i<10;i++) s+=c.charAt(Math.floor(Math.random()*c.length)); return SITE_URL+'/?ref='+cod+'&l='+s; }

function mostrarTela(id){ var ts=document.querySelectorAll('.tela'); for(var i=0;i<ts.length;i++) ts[i].classList.remove('ativa'); document.getElementById(id).classList.add('ativa'); }function carregarUsuarios(cb){ db.collection('usuarios').get().then(function(s){ usuarios=[]; s.forEach(function(d){ var x=d.data(); x.uid=d.id; usuarios.push(x); }); if(cb)cb(); }).catch(function(){ if(cb)cb(); }); }
function carregarDepositos(cb){ db.collection('depositos').orderBy('timestamp','desc').limit(200).get().then(function(s){ depositos=[]; s.forEach(function(d){ var x=d.data(); x.docId=d.id; depositos.push(x); }); if(cb)cb(); }).catch(function(){ if(cb)cb(); }); }
function carregarSaques(cb){ db.collection('saques').orderBy('timestamp','desc').limit(200).get().then(function(s){ saques=[]; s.forEach(function(d){ var x=d.data(); x.docId=d.id; saques.push(x); }); if(cb)cb(); }).catch(function(){ if(cb)cb(); }); }
function carregarTudo(cb){ carregarUsuarios(function(){ carregarDepositos(function(){ carregarSaques(function(){ if(cb)cb(); }); }); }); }

document.getElementById('formCadastro').addEventListener('submit', function(e){
    e.preventDefault();
    var nome=document.getElementById('r_name').value.trim();
    var email=document.getElementById('r_email').value.trim().toLowerCase();
    var tel=document.getElementById('r_tel').value.trim();
    var senha=document.getElementById('r_pass').value;
    var cod=document.getElementById('r_code').value.trim().toUpperCase();
    if(!nome||!email||!tel||!senha){ mostrarMsg('Preencha todos os campos.','error'); return; }
    if(senha.length<6){ mostrarMsg('Senha mínima 6 caracteres.','error'); return; }
    if(email.indexOf('@')===-1){ mostrarMsg('E-mail inválido.','error'); return; }
    document.getElementById('btnCadastro').disabled=true;
    document.getElementById('btnCadastro').textContent='A criar...';
    auth.createUserWithEmailAndPassword(email,senha).then(function(cred){
        var uid=cred.user.uid;
        var codigoUnico=gerarCodigo();
        var isAdmin=(tel===ADMIN_TELEFONE);
        var dados={
            uid:uid, nome:nome, email:email, telefone:tel,
            codigoConvite:codigoUnico, linkConvite:gerarLink(codigoUnico),
            convidadoPor:cod||null, admin:isAdmin,
            saldo:0, totalDepositado:0, totalSacado:0, totalBonus:0, ganhosHoje:0, totalGanho:0,
            planoAtivo:null, dataRegisto:new Date().toLocaleDateString('pt-BR'),
            bloqueado:false, timestamp:firebase.firestore.FieldValue.serverTimestamp()
        };
        return db.collection('usuarios').doc(uid).set(dados);
    }).then(function(){
        mostrarMsg('Conta criada! Faça login.','success');
        document.getElementById('formCadastro').reset();
        document.getElementById('l_email').value=email;
        document.getElementById('btnCadastro').disabled=false;
        document.getElementById('btnCadastro').textContent='Criar Conta';
        setTimeout(function(){ trocarTelaAuth('login'); },1500);
    }).catch(function(err){
        document.getElementById('btnCadastro').disabled=false;
        document.getElementById('btnCadastro').textContent='Criar Conta';
        var m='Erro ao criar conta.';
        if(err.code==='auth/email-already-in-use') m='E-mail já cadastrado.';
        else if(err.code==='auth/weak-password') m='Senha fraca.';
        else if(err.code==='auth/invalid-email') m='E-mail inválido.';
        mostrarMsg(m,'error');
    });
});

document.getElementById('formLogin').addEventListener('submit', function(e){
    e.preventDefault();
    var email=document.getElementById('l_email').value.trim().toLowerCase();
    var senha=document.getElementById('l_pass').value;
    if(!email||!senha){ mostrarMsg('Preencha tudo.','error'); return; }
    document.getElementById('btnLogin').disabled=true;
    document.getElementById('btnLogin').textContent='A entrar...';
    auth.signInWithEmailAndPassword(email,senha).then(function(cred){
        return db.collection('usuarios').doc(cred.user.uid).get();
    }).then(function(doc){
        if(!doc.exists){ mostrarMsg('Perfil não encontrado.','error'); document.getElementById('btnLogin').disabled=false; document.getElementById('btnLogin').textContent='Entrar'; return; }
        var d=doc.data(); d.uid=doc.id;
        if(d.bloqueado){ mostrarMsg('Conta bloqueada.','error'); auth.signOut(); document.getElementById('btnLogin').disabled=false; document.getElementById('btnLogin').textContent='Entrar'; return; }
        usuarioAtual=d;
        document.getElementById('btnLogin').disabled=false;
        document.getElementById('btnLogin').textContent='Entrar';
        abrirApp();
    }).catch(function(err){
        document.getElementById('btnLogin').disabled=false;
        document.getElementById('btnLogin').textContent='Entrar';
        var m='E-mail ou senha incorretos.';
        if(err.code==='auth/wrong-password') m='Senha incorreta.';
        else if(err.code==='auth/user-not-found') m='Utilizador não encontrado.';
        mostrarMsg(m,'error');
    });

function mudarTab(t){
    var items=document.querySelectorAll('.nav-item');
    for(var i=0;i<items.length;i++) items[i].classList.toggle('active', items[i].getAttribute('data-tab')===t);
    var c=document.getElementById('conteudoApp');
    if(t==='inicio') c.innerHTML=renderInicio();
    else if(t==='investir') c.innerHTML=renderInvestir();
    else if(t==='depositar') c.innerHTML=renderDepositar();
    else if(t==='sacar') c.innerHTML=renderSacar();
    else if(t==='equipa') c.innerHTML=renderEquipa();
    else if(t==='perfil') c.innerHTML=renderPerfil();
    window.scrollTo(0,0);
}

function admAjustarSaldo(){

    var u=usuarios.filter(function(x){return x.uid===uid;})[0];
    if(!u)return;
    var novo=u.saldo+v;

    db.collection('usuarios').doc(uid).update({saldo:novo}).then(function(){
        alert('✅ Novo saldo: '+formatKz(novo));
        carregarTudo(function(){mudarTab('inicio');});

function admAprovarDep(docId){
    var d=depositos.filter(function(x){return x.docId===docId;})[0];
    if(!d||d.status!=='pendente')return;
    var u=usuarios.filter(function(x){return x.uid===d.userId;})[0];
    if(!u)return;
    var novoSaldo=u.saldo+d.valor;
    var novoTotal=(u.totalDepositado||0)+d.valor;
    db.collection('usuarios').doc(d.userId).update({saldo:novoSaldo,totalDepositado:novoTotal}).then(function(){
        return db.collection('depositos').doc(docId).update({status:'aprovado',dataAprovacao:new Date().toLocaleString('pt-BR')});
    }).then(function(){
        if(u.convidadoPor){
            db.collection('usuarios').where('codigoConvite','==',u.convidadoPor).get().then(function(s){
                if(s.size>0){
                    var patr=s.docs[0].data();
                    var bonus=d.valor*BONUS_PCT;
                    var novoBonus=(patr.totalBonus||0)+bonus;
                    var novoSaldoPatr=(patr.saldo||0)+bonus;
                    db.collection('usuarios').doc(s.docs[0].id).update({totalBonus:novoBonus,saldo:novoSaldoPatr});
                }
            }).catch(function(){});
        }
        alert('✅ Aprovado!');
        carregarTudo(function(){mudarTab('inicio');});
    });
}

function admRejeitarSaq(docId){

function mostrarFicheiro(input,id){ if(input.files&&input.files[0]) document.getElementById(id).textContent='✅ '+input.files[0].name; }

function enviarDeposito(){
    var u=usuarioAtual;
    var valor=parseFloat(document.getElementById('dep_valor').value);
    var conta=document.getElementById('dep_conta').value.trim();
    var file=document.getElementById('dep_file').files[0];
    var h=new Date().getHours();
    if(h<HORA_DEP_INICIO||h>=HORA_DEP_FIM){alert('Depósitos aceitos das 6h00 às 23h45.');return;}
    if(isNaN(valor)||valor<MIN_DEPOSITO){alert('Valor mínimo: '+formatKz(MIN_DEPOSITO));return;}
    if(!conta){alert('Informe a conta usada.');return;}
    if(!file){alert('Envie o comprovativo.');return;}
    var reader=new FileReader();
    reader.onload=function(){
        var comp=reader.result;
        if(comp.length>900000){alert('Imagem muito grande.');return;}
        db.collection('depositos').add({
            userId:u.uid,userNome:u.nome,userTelefone:u.telefone,
            valor:valor,conta:conta,comprovativo:comp,
            data:new Date().toLocaleString('pt-BR'),status:'pendente',
            timestamp:firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
            alert('✅ Enviado! Aguarde aprovação.');
            carregarTudo(function(){mudarTab('inicio');});
        });
    };
    reader.readAsDataURL(file);
}

function renderSacar(){
    var u=usuarioAtual;
    var h=new Date().getHours();
    var dentro=h>=HORA_SAQ_INICIO&&h<HORA_SAQ_FIM;
    var html='<h3 class="section-title">🏧 Sacar</h3>';
    html+='<div class="card card-gradient"><div class="label">Saldo disponível</div><div class="valor">'+formatKz(u.saldo)+'</div></div>';
    html+='<div class="card"><div style="font-size:13px;margin-bottom:6px">Mínimo: <b>'+formatKz(MIN_SAQUE)+'</b></div>';
    html+='<div style="font-size:13px;margin-bottom:6px">Taxa: <b>8%</b></div>';
    html+='<div style="font-size:13px;margin-bottom:6px">Horário: <b>10h30 às 16h00</b></div>';
    html+='<div style="font-size:13px;color:'+(dentro?'#2e7d32':'#e65100')+';font-weight:600">'+(dentro?'✅ Dentro do horário':'⚠️ Fora do horário')+'</div></div>';
    html+='<div class="card"><div class="form-group"><label>Valor bruto (Kz)</label><input type="number" id="saq_valor" placeholder="Ex: 5000"></div>';
    html+='<div class="form-group"><label>Método de levantamento</label><select id="saq_metodo" onchange="mudarMetodoSaque()"><option value="referencia">Pagamento por Referência (telefone)</option><option value="iban">Transferência Bancária (IBAN)</option></select></div>';
    html+='<div id="saq_campo"></div>';
    html+='<button class="btn-principal" '+(dentro?'':'disabled')+' onclick="enviarSaque()">Solicitar Saque</button></div>';
    setTimeout(mudarMetodoSaque,50);
    return html;
}

function mudarMetodoSaque(){
    var met=document.getElementById('saq_metodo');
    if(!met)return;
    var el=document.getElementById('saq_campo');
    if(met.value==='referencia'){
        el.innerHTML='<div class="form-group"><label>Nº de telefone</label><input type="tel" id="saq_conta" placeholder="9XX XXX XXX"></div>';
    } else {
        el.innerHTML='<div class="form-group"><label>IBAN de destino</label><input type="text" id="saq_conta" placeholder="AO06..."></div>';
    }
}

function enviarSaque(){
    var u=usuarioAtual;
    var valor=parseFloat(document.getElementById('saq_valor').value);
    var metodo=document.getElementById('saq_metodo').value;
    var conta=document.getElementById('saq_conta').value.trim();
    if(isNaN(valor)||valor<MIN_SAQUE){alert('Valor mínimo: '+formatKz(MIN_SAQUE));return;}
    if(valor>u.saldo){alert('Saldo insuficiente.');return;}
    if(!conta){alert('Preencha a conta.');return;}
    var taxa=valor*TAXA_SAQUE;
    var liquido=valor-taxa;
    var metNome=metodo==='referencia'?'Referência (telefone)':'IBAN';
    if(!confirm('Bruto: '+formatKz(valor)+'\nTaxa 8%: '+formatKz(taxa)+'\nLíquido: '+formatKz(liquido)+'\nMétodo: '+metNome+'\n\nConfirmar?'))return;
    var novoSaldo=u.saldo-valor;
    var novoSacado=(u.totalSacado||0)+valor;
    db.collection('usuarios').doc(u.uid).update({saldo:novoSaldo,totalSacado:novoSacado}).then(function(){
        return db.collection('saques').add({
            userId:u.uid,userNome:u.nome,userTelefone:u.telefone,
            valor:valor,taxa:taxa,liquido:liquido,
            metodo:metNome,conta:conta,
            data:new Date().toLocaleString('pt-BR'),status:'pendente',
            timestamp:firebase.firestore.FieldValue.serverTimestamp()
        });
    }).then(function(){
        usuarioAtual.saldo=novoSaldo;
        alert('✅ Solicitado!');
        carregarTudo(function(){mudarTab('inicio');});
    });
    }function renderEquipa(){
    var u=usuarioAtual;
    var conv=usuarios.filter(function(x){return x.convidadoPor===u.codigoConvite;});
    var h='<h3 class="section-title">👥 Minha Equipa</h3>';
    h+='<div class="card card-gradient"><div class="label">Total de convidados</div><div class="valor">'+conv.length+'</div></div>';
    h+='<div class="card"><div style="font-size:13px;margin-bottom:8px">🔗 Link único de convite:</div>';
    h+='<div style="background:#f7faff;padding:10px;border-radius:8px;font-size:11px;word-break:break-all;color:#1976d2">'+u.linkConvite+'</div>';
    h+='<button class="btn-principal" style="margin-top:10px;background:#25D366" onclick="copiar(\''+u.linkConvite+'\')">📋 Copiar Link</button>';
    h+='<button class="btn-principal" style="margin-top:8px;background:#25D366" onclick="partilharWA(\''+u.linkConvite+'\')">💬 Partilhar WhatsApp</button></div>';
    h+='<div class="card"><div style="font-size:13px;margin-bottom:8px">🎁 Código: <b>'+u.codigoConvite+'</b></div>';
    h+='<div style="font-size:12px;color:#5a6b85">Ganhe <b>5%</b> de bónus quando o seu convidado investir.</div></div>';
    if(conv.length>0){
        h+='<h3 class="section-title">Convidados</h3>';
        conv.forEach(function(c){
            h+='<div class="card" style="padding:12px"><div style="font-weight:600">'+c.nome+'</div><div style="font-size:12px;color:#5a6b85">'+c.telefone+' · '+c.dataRegisto+'</div></div>';
        });
    }
    return h;
}

function partilharWA(link){
    var m='🚀 Junta-te a mim na InvestProAO!\n\n💰 Ganha dinheiro investindo.\n📈 Retornos diários garantidos.\n\n🔗 '+link;
    window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank');
}

function renderPerfil(){
    var u=usuarioAtual;
    var ini=u.nome.charAt(0).toUpperCase();
    var h='<div class="perfil-header"><div class="perfil-avatar">'+ini+'</div>';
    h+='<div class="perfil-nome">'+u.nome+'</div><div class="perfil-codigo">'+u.codigoConvite+'</div></div>';
    h+='<div class="card" style="padding:0">';
    h+='<div class="perfil-linha"><span class="lbl">E-mail</span><span class="val">'+u.email+'</span></div>';
    h+='<div class="perfil-linha"><span class="lbl">Telefone</span><span class="val">'+u.telefone+'</span></div>';
    h+='<div class="perfil-linha"><span class="lbl">Código</span><span class="val">'+u.codigoConvite+'</span></div>';
    h+='<div class="perfil-linha"><span class="lbl">Estado</span><span class="val" style="color:#2e7d32">'+(u.bloqueado?'Bloqueado':'Ativo')+'</span></div></div>';
    h+='<div style="margin-top:16px">';
    h+='<a href="'+WHATSAPP_GRUPO+'" target="_blank" style="text-decoration:none"><button class="btn-full btn-green">💬 Entrar no Grupo WhatsApp</button></a>';
    h+='<button class="btn-full btn-blue" onclick="sair()">Terminar Sessão</button></div>';
    return h;
}

function verHistorico(){
    var u=usuarioAtual;
    var deps=depositos.filter(function(d){return d.userId===u.uid;});
    var saqs=saques.filter(function(s){return s.userId===u.uid;});
    var t='📋 Histórico\n\n';
    if(deps.length===0&&saqs.length===0) t+='Nenhuma transação.';
    deps.forEach(function(d){ t+='💰 Depósito: '+formatKz(d.valor)+' — '+d.status+' ('+d.data+')\n'; });
    saqs.forEach(function(s){ t+='🏧 Saque: '+formatKz(s.valor)+' — '+s.status+' ('+s.data+')\n'; });
    alert(t);
}

auth.onAuthStateChanged(function(user){
    if(user){
        db.collection('usuarios').doc(user.uid).get().then(function(doc){
            if(doc.exists){
                var d=doc.data(); d.uid=doc.id;
                usuarioAtual=d;
                abrirApp();
            } else { mostrarTela('telaAuth'); }
        }).catch(function(){ mostrarTela('telaAuth'); });
    } else {
        mostrarTela('telaAuth');
        try {
            var p=new URLSearchParams(window.location.search);
            var ref=p.get('ref');
            if(ref){
                setTimeout(function(){ var c=document.getElementById('r_code'); if(c) c.value=ref; },300);
            }
        } catch(e){}
    }
});
</script>
