<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvestPrime AO — Invista hoje, colha lucros amanhã.</title>
<style>
:root{
  --navy:#0A1F44; --gold:#F5B301; --white:#FFFFFF; --gray:#F4F6FA;
  --gray-2:#e4e8f0; --text:#1a2233; --muted:#6b7691;
  --danger:#e74c3c; --ok:#27ae60; --warn:#f39c12;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--gray);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--gray-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--gray-2);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
.shield{width:36px;height:40px;background:var(--navy);clip-path:polygon(50% 0,100% 15%,100% 70%,50% 100%,0 70%,0 15%);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:900}
.nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" style="position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:10px;transform:translateY(100px);opacity:0;transition:.3s;z-index:200"></div>

<script>
const LS_KEY='investprime_ao_v1';
const DAILY_RATE=0.023;

const seedPlans=()=>{const p=[];let v=5000,id=1;while(v<180000){p.push({id:id++,valor_kz:v});v+=6000;}p.push({id:id++,valor_kz:180000});return p;};

function nowISO(){return new Date().toISOString();}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return 'd$'+Math.abs(h).toString(16);}

const defaultDB=()=>({
  users:[{id:1,nome_completo:'Administrador',email:'admin@investprimeao.com',telefone:'933798228',senha_hash:hash('admin123'),codigo_convite:'IP-ADMIN',convidado_por:null,saldo:0,total_investido:0,total_lucro:0,total_levantado:0,is_admin:true,is_blocked:false,created_at:nowISO()}],
  plans:seedPlans(),
  investments:[],deposits:[],withdrawals:[],referrals:[],transactions:[],
  notifications:[{id:1,user_id:null,titulo:'Bem-vindo à InvestPrime AO',mensagem:'Plataforma em demonstração. Nenhum retorno é garantido.',lida:false,created_at:nowISO()}],
  settings:{deposit_open:'07:00',deposit_close:'21:45',withdraw_open:'11:00',withdraw_close:'18:00',shutdown_date:'2028-11-27',support:['933 798 228','955 748 798'],paypay_ref:'944478303',iban:'005500004565120910147',withdraw_fee_pct:9},
  _seq:{users:2,investments:1,deposits:1,withdrawals:1,referrals:1,transactions:1,notifications:2}
});

function loadDB(){try{const r=localStorage.getItem(LS_KEY);if(!r){const d=defaultDB();localStorage.setItem(LS_KEY,JSON.stringify(d));return d;}return JSON.parse(r);}catch(e){return defaultDB();}}
function saveDB(db){localStorage.setItem(LS_KEY,JSON.stringify(db));}
let DB=loadDB();const fmtKz=n=>new Intl.NumberFormat('pt-AO',{maximumFractionDigits:0}).format(Math.round(n))+' Kz';
const fmtDate=d=>new Date(d).toLocaleString('pt-AO');
const nextId=t=>DB._seq[t]++;
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='IP-';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function toast(m,t=''){const e=document.getElementById('toast');e.textContent=m;e.style.transform='translateY(0)';e.style.opacity='1';e.style.background=t==='ok'?'var(--ok)':t==='err'?'var(--danger)':'var(--navy)';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.transform='translateY(100px)';e.style.opacity='0';},2800);}
function inWindow(o,c,n=new Date()){const[oh,om]=o.split(':').map(Number),[ch,cm]=c.split(':').map(Number);const m=n.getHours()*60+n.getMinutes();return m>=oh*60+om&&m<=ch*60+cm;}
function depositOpen(){return inWindow(DB.settings.deposit_open,DB.settings.deposit_close);}
function withdrawOpen(){return inWindow(DB.settings.withdraw_open,DB.settings.withdraw_close);}
function currentUser(){const id=parseInt(localStorage.getItem('ip_user')||'0',10);return DB.users.find(u=>u.id===id)||null;}
function setUser(id){if(id)localStorage.setItem('ip_user',String(id));else localStorage.removeItem('ip_user');}
function txn(uid,t,v,d){DB.transactions.push({id:nextId('transactions'),user_id:uid,tipo:t,valor:v,descricao:d,created_at:nowISO()});}
function notify(uid,t,m){DB.notifications.push({id:nextId('notifications'),user_id:uid,titulo:t,mensagem:m,lida:false,created_at:nowISO()});}
function planCalc(v){return{daily:v*DAILY_RATE,total:v*DAILY_RATE*30};}
function getUserById(id){return DB.users.find(u=>u.id===id)||null;}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Copiado: '+t,'ok')).catch(()=>toast('Erro ao copiar','err'));}
function toggleDark(){document.body.classList.toggle('dark');}
function toggleSidebar(){const s=document.getElementById('sidebar');if(s)s.classList.toggle('open');}
function openModal(h){document.getElementById('modalRoot').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()" style="position:fixed;inset:0;background:rgba(10,31,68,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100"><div class="modal" style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto">'+h+'</div></div>';}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openTerms(){openModal('<h3>Termos & Condições</h3><p style="font-size:.88rem;line-height:1.6;color:#6b7691">A InvestPrime AO é uma plataforma demonstrativa. Nenhum retorno é garantido. Os valores (2,3%/dia) são referências matemáticas, não promessas. Investir envolve risco.</p><div style="text-align:right;margin-top:20px"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>');}
function openPrivacy(){openModal('<h3>Política de Privacidade</h3><p style="font-size:.88rem;line-height:1.6;color:#6b7691">Os dados fornecidos são usados apenas para gestão da conta nesta demonstração.</p><div style="text-align:right;margin-top:20px"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>');}
function logout(){setUser(null);toast('Sessão terminada.');navigate('landing');}
