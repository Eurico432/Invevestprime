/* ===== AUXILIARES ===== */
function formatKz(v) {
    var n = Number(v) || 0;
    return n.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
}

function mostrarMsg(texto, tipo) {
    var el = document.getElementById('mensagemAuth');
    if (!el) return;
    el.textContent = texto;
    el.className = 'msg ' + tipo;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
}

function copiar(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function() {
            alert('✅ Copiado: ' + texto);
        }).catch(function() { prompt('Copie:', texto); });
    } else {
        prompt('Copie:', texto);
    }
}

function gerarCodigo() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var s = 'VIP';
    for (var i = 0; i < 6; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return s;
}

function gerarLinkUnico(codigo) {
    var chars = 'abcdefghijkmnpqrstuvwxyz23456789';
    var s = '';
    for (var i = 0; i < 10; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return 'https://eurico432.github.io/Invevestprime/?ref=' + codigo + '&l=' + s;
}

function trocarTelaAuth(tela) {
    document.getElementById('divCadastro').style.display = (tela === 'cadastro') ? 'block' : 'none';
    document.getElementById('divLogin').style.display = (tela === 'login') ? 'block' : 'none';
    document.getElementById('mensagemAuth').style.display = 'none';
}

function mostrarTela(id) {
    var telas = document.querySelectorAll('.tela');
    for (var i = 0; i < telas.length; i++) telas[i].classList.remove('ativa');
    document.getElementById(id).classList.add('ativa');
}

/* ===== CARREGAR DADOS DO FIRESTORE ===== */
function carregarUsuarios(callback) {
    db.collection('usuarios').get().then(function(snap) {
        usuarios = [];
        snap.forEach(function(doc) {
            var d = doc.data();
            d.uid = doc.id;
            usuarios.push(d);
        });
        if (callback) callback();
    }).catch(function(e) {
        console.error('Erro usuarios:', e);
        if (callback) callback();
    });
}

function carregarDepositos(callback) {
    db.collection('depositos').orderBy('timestamp', 'desc').limit(100).get().then(function(snap) {
        depositos = [];
        snap.forEach(function(doc) {
            var d = doc.data();
            d.docId = doc.id;
            depositos.push(d);
        });
        if (callback) callback();
    }).catch(function(e) {
        console.error('Erro depositos:', e);
        if (callback) callback();
    });
}

function carregarSaques(callback) {
    db.collection('saques').orderBy('timestamp', 'desc').limit(100).get().then(function(snap) {
        saques = [];
        snap.forEach(function(doc) {
            var d = doc.data();
            d.docId = doc.id;
            saques.push(d);
        });
        if (callback) callback();
    }).catch(function(e) {
        console.error('Erro saques:', e);
        if (callback) callback();
    });
}

function carregarTudo(callback) {
    carregarUsuarios(function() {
        carregarDepositos(function() {
            carregarSaques(function() {
                if (callback) callback();
            });
        });
    });
}

/* ===== LOGIN / CADASTRO ===== */
document.getElementById('formCadastro').addEventListener('submit', function(e) {
    e.preventDefault();
    var nome = document.getElementById('r_name').value.trim();
    var email = document.getElementById('r_email').value.trim().toLowerCase();
    var telefone = document.getElementById('r_tel').value.trim();
    var senha = document.getElementById('r_pass').value;
    var codigo = document.getElementById('r_code').value.trim().toUpperCase();

    if (!nome || !email || !telefone || !senha) { mostrarMsg('Preencha todos os campos.', 'error'); return; }
    if (senha.length < 6) { mostrarMsg('Senha mínima 6 caracteres.', 'error'); return; }
    if (email.indexOf('@') === -1) { mostrarMsg('E-mail inválido.', 'error'); return; }

    document.getElementById('btnCadastro').disabled = true;
    document.getElementById('btnCadastro').textContent = 'A criar...';

    auth.createUserWithEmailAndPassword(email, senha).then(function(cred) {
        var uid = cred.user.uid;
        var codigoUnico = gerarCodigo();
        var isAdmin = (email === ADMIN_EMAIL);

        var dados = {
            uid: uid,
            nome: nome,
            email: email,
            telefone: telefone,
            codigoConvite: codigoUnico,
            linkConvite: gerarLinkUnico(codigoUnico),
            convidadoPor: codigo || null,
            admin: isAdmin,
            saldo: 0,
            totalDepositado: 0,
            totalSacado: 0,
            totalBonus: 0,
            ganhosHoje: 0,
            planoAtivo: null,
            dataRegisto: new Date().toLocaleDateString('pt-BR'),
            bloqueado: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        return db.collection('usuarios').doc(uid).set(dados);
    }).then(function() {
        mostrarMsg('Conta criada! Faça login.', 'success');
        document.getElementById('formCadastro').reset();
        document.getElementById('l_email').value = email;
        document.getElementById('btnCadastro').disabled = false;
        document.getElementById('btnCadastro').textContent = 'Criar Conta';
        setTimeout(function() { trocarTelaAuth('login'); }, 1500);
    }).catch(function(err) {
        document.getElementById('btnCadastro').disabled = false;
        document.getElementById('btnCadastro').textContent = 'Criar Conta';
        var msg = 'Erro ao criar conta.';
        if (err.code === 'auth/email-already-in-use') msg = 'Este e-mail já está cadastrado.';
        else if (err.code === 'auth/weak-password') msg = 'Senha fraca. Use 6+ caracteres.';
        else if (err.code === 'auth/invalid-email') msg = 'E-mail inválido.';
        mostrarMsg(msg, 'error');
    });
});
